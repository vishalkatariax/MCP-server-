[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn server:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 300 --timeout-graceful-shutdown 30 --workers 1"
healthcheckPath = "/"
healthcheckTimeout = 120000
healthcheckInterval = 30000
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
